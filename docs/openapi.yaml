{
  "openapi": "3.0.3",
  "info": {
    "title": "BigFish Integrated API",
    "version": "1.0.0",
    "description": "配置、主会话、DeepSeek/阿里云 NLS、诊断和播放；抖音本机内存身份配置及有界接收检查。真实评论/礼物已在指定 external 独立采集验证，主会话到感谢播放仍需验收。"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:18080"
    }
  ],
  "paths": {
    "/api/v1/bootstrap": {
      "get": {
        "operationId": "bootstrap",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Bootstrap"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/config": {
      "get": {
        "operationId": "getConfig",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConfigSnapshot"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "updateConfig",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateConfigRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConfigSnapshot"
                }
              }
            }
          },
          "400": {
            "description": "字段无效",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "409": {
            "description": "版本冲突",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        }
      }
    },
    "/actuator/health": {
      "get": {
        "operationId": "health",
        "responses": {
          "200": {
            "description": "应用健康，响应含 status=UP"
          },
          "503": {
            "description": "应用不健康"
          }
        }
      }
    },
    "/api/v1/runtime": {
      "get": {
        "operationId": "runtime",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/sessions": {
      "post": {
        "operationId": "startSession",
        "responses": {
          "201": {
            "description": "会话已创建；采集异步连接，播放器需完成租约与 READY。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          },
          "400": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "409": {
            "description": "SESSION_ACTIVE：已有活动会话；COLLECTOR_STOPPING：上一采集器资源尚未释放。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "422": {
            "description": "DOUYIN_ROOM_REQUIRED / DOUYIN_UNSUPPORTED_ROOM_URL，或云服务开关/配置/音色不可用；响应给出固定安全代码。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "503": {
            "description": "PROVIDER_UNAVAILABLE / COLLECTOR_START_FAILED：初始化失败，处理链已关闭并清理。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StartSessionRequest"
              }
            }
          }
        },
        "description": "显式创建唯一活动会话；重复启动不会重启已有会话。查询和配置保存不自动创建，启动结果不明时先查询 runtime，不盲目重复 POST。"
      }
    },
    "/api/v1/sessions/{sessionId}/stop": {
      "post": {
        "operationId": "stopSession",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          },
          "409": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "description": "停止幂等，旧 ID 返回 409，不影响新会话。"
      }
    },
    "/api/v1/sessions/{sessionId}/replay": {
      "post": {
        "operationId": "replaySession",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          },
          "409": {
            "description": "SESSION_MISMATCH / PLAYER_NOT_READY / MOCK_ONLY / COLLECTOR_STOPPING；仅当前就绪的 MOCK 会话允许回放。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "description": "仅当前 RUNNING/MOCK 会话且播放器已 READY；重建本次模拟采集源，回放人工评论和累计 1→3→3 礼物。"
      }
    },
    "/api/v1/events/simulate": {
      "post": {
        "operationId": "simulateEvent",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "200": {
            "description": "重复事件",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "409": {
            "description": "会话不匹配",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "429": {
            "description": "队列拒绝",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "400": {
            "description": "结构错误 ApiError 或内容校验 INVALID",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/EventResult"
                    }
                  ]
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LiveEvent"
              }
            }
          }
        },
        "description": "仅 MOCK 会话可接受模拟事件；DOUYIN 返回 409 MOCK_ONLY，不能依赖前端禁用按钮隔离。"
      }
    },
    "/api/v1/audio/{assetId}": {
      "get": {
        "operationId": "audioAsset",
        "parameters": [
          {
            "name": "assetId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "当前有效任务测试 WAV，no-store/nosniff，最大 2 MiB",
            "content": {
              "audio/wav": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "404": {
            "description": "未注册、已停止、已过期或路径非法"
          }
        }
      }
    },
    "/api/v1/providers": {
      "get": {
        "operationId": "providers",
        "description": "只检查本机配置和最近诊断，不访问云服务，不返回凭据。",
        "responses": {
          "200": {
            "description": "供应商配置状态",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProvidersView"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/providers/deepseek/check": {
      "post": {
        "operationId": "checkDeepSeekModels",
        "description": "显式调用官方模型目录，无请求体；后端期限 10 秒，客户端应允许至少 12 秒；无生成请求，无自动后台轮询。",
        "responses": {
          "200": {
            "description": "检查结果（需查看各验证字段）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelCheck"
                }
              }
            }
          },
          "503": {
            "description": "未启用、缺凭据或检查失败",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/runtime/diagnostics": {
      "get": {
        "summary": "读取有界运行诊断，协调已发生的采集终态，不启动采集或调用供应商",
        "responses": {
          "200": {
            "description": "当前会话摘要及有限阶段记录",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeDiagnosticsView"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/douyin/credentials": {
      "get": {
        "operationId": "getDouyinCredentialStatus",
        "parameters": [
          {
            "name": "X-BigFish-Local-Management",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "1"
              ]
            }
          }
        ],
        "description": "仅本机同源管理；凭据仅进程内存，运行时配置优先环境配置。修改需 revision CAS 且无活跃租约；游客/清除不在本进程回退环境 Cookie。启动检查仅采集，不经过 AI/TTS。状态字段只给脱敏元数据。",
        "responses": {
          "200": {
            "description": "成功；检查启动为异步结果，不表示登录或收到礼物",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinCredentialStatus"
                }
              }
            }
          },
          "400": {
            "description": "固定输入错误码，不回显输入",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "403": {
            "description": "本机/同源/请求头校验拒绝",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "409": {
            "description": "版本冲突或互动/检查仍在使用凭据",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "413": {
            "description": "JSON 请求超过 32768 字节",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "429": {
            "description": "检查间隔30秒且每5分钟最多3次",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "503": {
            "description": "凭据不可用或检查无法创建",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          }
        }
      }
    },
