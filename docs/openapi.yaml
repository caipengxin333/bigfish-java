{
  "openapi": "3.0.3",
  "info": {
    "title": "BigFish Integrated API",
    "version": "1.0.0",
    "description": "配置、MOCK 会话、模拟采集回放、DeepSeek/阿里云 NLS、Token 状态、有限运行诊断及播放接口；真实抖音接收待验收，主会话仍禁用。"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:18080"
    }
  ],
  "paths": {
    "/api/v1/bootstrap": {
      "get": {
        "operationId": "bootstrap",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Bootstrap"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/config": {
      "get": {
        "operationId": "getConfig",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConfigSnapshot"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "updateConfig",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateConfigRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConfigSnapshot"
                }
              }
            }
          },
          "400": {
            "description": "字段无效",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "409": {
            "description": "版本冲突",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        }
      }
    },
    "/actuator/health": {
      "get": {
        "operationId": "health",
        "responses": {
          "200": {
            "description": "应用健康，响应含 status=UP"
          },
          "503": {
            "description": "应用不健康"
          }
        }
      }
    },
    "/api/v1/runtime": {
      "get": {
        "operationId": "runtime",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/sessions": {
      "post": {
        "operationId": "startSession",
        "responses": {
          "201": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          },
          "400": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "409": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "422": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "503": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StartSessionRequest"
              }
            }
          }
        }
      }
    },
    "/api/v1/sessions/{sessionId}/stop": {
      "post": {
        "operationId": "stopSession",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          },
          "409": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "description": "停止幂等，旧 ID 返回 409，不影响新会话。"
      }
    },
    "/api/v1/sessions/{sessionId}/replay": {
      "post": {
        "operationId": "replaySession",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeView"
                }
              }
            }
          },
          "409": {
            "description": "校验失败或操作不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "description": "仅当前 RUNNING/MOCK 会话且播放器已 READY；重建本次模拟采集源，回放人工评论和累计 1→3→3 礼物。"
      }
    },
    "/api/v1/events/simulate": {
      "post": {
        "operationId": "simulateEvent",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "200": {
            "description": "重复事件",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "409": {
            "description": "会话不匹配",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "429": {
            "description": "队列拒绝",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventResult"
                }
              }
            }
          },
          "400": {
            "description": "结构错误 ApiError 或内容校验 INVALID",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/EventResult"
                    }
                  ]
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LiveEvent"
              }
            }
          }
        }
      }
    },
    "/api/v1/audio/{assetId}": {
      "get": {
        "operationId": "audioAsset",
        "parameters": [
          {
            "name": "assetId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "当前有效任务测试 WAV，no-store/nosniff，最大 2 MiB",
            "content": {
              "audio/wav": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "404": {
            "description": "未注册、已停止、已过期或路径非法"
          }
        }
      }
    },
    "/api/v1/providers": {
      "get": {
        "operationId": "providers",
        "description": "只检查本机配置和最近诊断，不访问云服务，不返回凭据。",
        "responses": {
          "200": {
            "description": "供应商配置状态",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProvidersView"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/providers/deepseek/check": {
      "post": {
        "operationId": "checkDeepSeekModels",
        "description": "显式调用官方模型目录，无请求体；后端期限 10 秒，客户端应允许至少 12 秒；无生成请求，无自动后台轮询。",
        "responses": {
          "200": {
            "description": "检查结果（需查看各验证字段）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelCheck"
                }
              }
            }
          },
          "503": {
            "description": "未启用、缺凭据或检查失败",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/runtime/diagnostics": {
      "get": {
        "summary": "读取有界运行诊断，不触发模型、语音或采集请求",
        "responses": {
          "200": {
            "description": "当前会话摘要及有限阶段记录",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeDiagnosticsView"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "RuntimeSettings": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "profileName",
          "persona",
          "roomId",
          "model",
          "maxOutputTokens",
          "voice",
          "readComment",
          "welcomeIntervalSeconds",
          "synthesisQueueCapacity",
          "playbackQueueCapacity",
          "priorities"
        ],
        "properties": {
          "profileName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "persona": {
            "type": "string",
            "maxLength": 8000
          },
          "roomId": {
            "type": "string",
            "pattern": "^[0-9]{0,30}$"
          },
          "model": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "maxOutputTokens": {
            "type": "integer",
            "minimum": 32,
            "maximum": 2048
          },
          "voice": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "readComment": {
            "type": "boolean"
          },
          "welcomeIntervalSeconds": {
            "type": "integer",
            "minimum": 5,
            "maximum": 600
          },
          "synthesisQueueCapacity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "playbackQueueCapacity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "priorities": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "gift",
              "comment",
              "follow",
              "entrance"
            ],
            "properties": {
              "gift": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "comment": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "follow": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "entrance": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              }
            }
          }
        }
      },
      "ConfigSnapshot": {
        "type": "object",
        "required": [
          "version",
          "updatedAt",
          "settings"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "settings": {
            "$ref": "#/components/schemas/RuntimeSettings"
          }
        }
      },
      "UpdateConfigRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedVersion",
          "settings"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "settings": {
            "$ref": "#/components/schemas/RuntimeSettings"
          }
        }
      },
      "ApiError": {
        "type": "object",
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "Bootstrap": {
        "type": "object",
        "required": [
          "application",
          "version",
          "mode",
          "sessionState",
          "capabilities"
        ],
        "properties": {
          "application": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "SCAFFOLD",
              "READY"
            ]
          },
          "sessionState": {
            "type": "string"
          },
          "capabilities": {
            "type": "object",
            "additionalProperties": {
              "type": "boolean"
            }
          }
        }
      },
      "StartSessionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "conversationMode"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "MOCK",
              "DOUYIN"
            ]
          },
          "conversationMode": {
            "type": "string",
            "enum": [
              "MOCK",
              "DEEPSEEK"
            ]
          },
          "speechMode": {
            "type": "string",
            "enum": [
              "LOCAL_TEST_TONE",
              "ALIYUN_NLS"
            ],
            "default": "LOCAL_TEST_TONE",
            "description": "可省略以兼容第一轮客户端；显式 null 非法。真实 NLS 要求云调用开关、AppKey、Token 和支持音色。"
          }
        },
        "description": "必须显式选择。当前 DOUYIN 返回 422；DEEPSEEK 需要服务端环境凭据及 BIGFISH_ALLOW_PAID=true，无静默回退。"
      },
      "QueueStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "depth",
          "capacity"
        ],
        "properties": {
          "depth": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "capacity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          }
        }
      },
      "RuntimeView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sessionId",
          "state",
          "mode",
          "conversationMode",
          "speechMode",
          "roomId",
          "savedConfigVersion",
          "appliedConfigVersion",
          "queues",
          "player",
          "collector",
          "dropped",
          "failures",
          "lastError",
          "lastErrorAt"
        ],
        "properties": {
          "sessionId": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "STOPPED",
              "STARTING",
              "RUNNING",
              "STOPPING",
              "FAILED"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "MOCK"
            ]
          },
          "conversationMode": {
            "type": "string",
            "enum": [
              "MOCK",
              "DEEPSEEK"
            ]
          },
          "speechMode": {
            "type": "string",
            "enum": [
              "LOCAL_TEST_TONE",
              "ALIYUN_NLS"
            ]
          },
          "roomId": {
            "type": "string"
          },
          "savedConfigVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "appliedConfigVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "queues": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "comments",
              "templates",
              "synthesis",
              "playback",
              "modelActive",
              "speechActive"
            ],
            "properties": {
              "comments": {
                "$ref": "#/components/schemas/QueueStatus"
              },
              "templates": {
                "$ref": "#/components/schemas/QueueStatus"
              },
              "synthesis": {
                "$ref": "#/components/schemas/QueueStatus"
              },
              "playback": {
                "$ref": "#/components/schemas/QueueStatus"
              },
              "modelActive": {
                "type": "boolean"
              },
              "speechActive": {
                "type": "boolean"
              }
            }
          },
          "player": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "connected",
              "ready",
              "playing",
              "leaseGeneration"
            ],
            "properties": {
              "connected": {
                "type": "boolean"
              },
              "ready": {
                "type": "boolean"
              },
              "playing": {
                "type": "boolean"
              },
              "leaseGeneration": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              }
            }
          },
          "collector": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "mode",
              "state",
              "received",
              "emitted",
              "duplicates",
              "rejected",
              "lastError"
            ],
            "properties": {
              "mode": {
                "type": "string",
                "enum": [
                  "MOCK"
                ]
              },
              "state": {
                "type": "string",
                "enum": [
                  "STOPPED",
                  "CONNECTING",
                  "CONNECTED",
                  "RECONNECTING",
                  "ENDED",
                  "FAILED"
                ]
              },
              "received": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "emitted": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "duplicates": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "rejected": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "lastError": {
                "type": "string"
              }
            }
          },
          "dropped": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "failures": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "lastError": {
            "type": "string",
            "description": "最近任务错误的稳定代码，不含供应商响应或凭据；新会话重置。"
          },
          "lastErrorAt": {
            "type": "string",
            "description": "ISO 时间；无错误时为空字符串。"
          }
        },
        "description": "collector 计数属于最近一次回放，dropped/failures 为进程累计；appliedConfigVersion 是最近接收任务使用的版本，队列内任务保留各自快照。READY/bootstrap 不代表真实抖音或人声服务可用。"
      },
      "EventResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "result"
        ],
        "properties": {
          "result": {
            "type": "string",
            "enum": [
              "ACCEPTED",
              "DUPLICATE",
              "REJECTED_FULL",
              "REJECTED_SESSION",
              "INVALID"
            ]
          }
        }
      },
      "LiveEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "eventId",
          "sessionId",
          "roomId",
          "type",
          "userId",
          "username",
          "receivedAt",
          "payload"
        ],
        "properties": {
          "schemaVersion": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "eventId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "sessionId": {
            "type": "string"
          },
          "roomId": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "COMMENT",
              "GIFT",
              "FOLLOW",
              "ENTRANCE",
              "LIKE"
            ]
          },
          "userId": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "receivedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "payload": {
            "type": "object",
            "description": "按 docs/event-schema.md 类型白名单校验；GIFT quantity 是正增量，unitValue 可为 null；COMMENT 仅 content。"
          }
        },
        "description": "receivedAt 服务端覆盖；仅当前 MOCK 会话和 mock-room 可接收；不发送平台评论。"
      },
      "ProviderState": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "configured",
          "enabled",
          "state",
          "reason"
        ],
        "properties": {
          "configured": {
            "type": "boolean"
          },
          "enabled": {
            "type": "boolean"
          },
          "state": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          }
        },
        "description": "configured 只表示环境变量存在；enabled 表示同时满足显式调用开关，不代表真实请求通过。UNVERIFIED 不等于认证成功。"
      },
      "ProvidersView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "deepseek",
          "aliyun",
          "douyin",
          "aliyunVoices",
          "speechTextLimit",
          "audioDurationLimitSeconds",
          "aliyunToken"
        ],
        "properties": {
          "deepseek": {
            "$ref": "#/components/schemas/ProviderState"
          },
          "aliyun": {
            "$ref": "#/components/schemas/ProviderState"
          },
          "douyin": {
            "$ref": "#/components/schemas/ProviderState"
          },
          "aliyunVoices": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "speechTextLimit": {
            "type": "integer",
            "minimum": 1
          },
          "audioDurationLimitSeconds": {
            "type": "integer",
            "minimum": 1
          },
          "aliyunToken": {
            "$ref": "#/components/schemas/NlsTokenState"
          }
        }
      },
      "ModelCheck": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "authentication",
          "selectedModel",
          "generation",
          "availableModels",
          "code",
          "elapsedMs"
        ],
        "properties": {
          "authentication": {
            "type": "string",
            "enum": [
              "NOT_CHECKED",
              "PASSED",
              "FAILED"
            ]
          },
          "selectedModel": {
            "type": "string",
            "enum": [
              "NOT_CHECKED",
              "PASSED",
              "FAILED"
            ]
          },
          "generation": {
            "type": "string",
            "enum": [
              "NOT_CHECKED",
              "PASSED",
              "FAILED"
            ]
          },
          "availableModels": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "code": {
            "type": "string"
          },
          "elapsedMs": {
            "type": "integer",
            "minimum": 0
          }
        },
        "description": "显式 GET /models 检查结果；generation 始终 NOT_CHECKED，不生成回复。检查保存配置中的模型。"
      },
      "NlsTokenState": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "status",
          "expiresAt",
          "remainingSeconds",
          "refreshResult",
          "lastError",
          "lastAttemptAt",
          "lastSuccessAt",
          "retryAfterMillis",
          "attempts"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "STATIC",
              "RAM",
              "INVALID"
            ]
          },
          "status": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "remainingSeconds": {
            "type": "integer",
            "minimum": 0,
            "nullable": true
          },
          "refreshResult": {
            "type": "string"
          },
          "lastError": {
            "type": "string"
          },
          "lastAttemptAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "lastSuccessAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "retryAfterMillis": {
            "type": "integer",
            "minimum": 0
          },
          "attempts": {
            "type": "integer",
            "minimum": 0
          }
        },
        "description": "只读脱敏状态；STATIC 到期时间未知时为 null。RAM 的 MISSING + NOT_REQUESTED 表示尚未按需签发，区别于 MISSING_CONFIGURATION。轮询不调用云服务。"
      },
      "DiagnosticTrace": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sequence",
          "taskId",
          "eventType",
          "configVersion",
          "stage",
          "reason",
          "at",
          "previousStageMs",
          "taskElapsedMs"
        ],
        "properties": {
          "sequence": {
            "type": "integer",
            "minimum": 0
          },
          "taskId": {
            "type": "string"
          },
          "eventType": {
            "type": "string"
          },
          "configVersion": {
            "type": "integer",
            "minimum": 0
          },
          "stage": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "at": {
            "type": "string",
            "format": "date-time"
          },
          "previousStageMs": {
            "type": "integer",
            "minimum": 0
          },
          "taskElapsedMs": {
            "type": "integer",
            "minimum": 0
          }
        },
        "description": "只含服务端任务 ID、固定阶段/原因和耗时；非法输入的 eventType 为空字符串，不返回正文、昵称、外部 eventId 或上游异常。"
      },
      "DiagnosticWorker": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "threads",
          "active",
          "queued",
          "completed"
        ],
        "properties": {
          "threads": {
            "type": "integer",
            "minimum": 0
          },
          "active": {
            "type": "integer",
            "minimum": 0
          },
          "queued": {
            "type": "integer",
            "minimum": 0
          },
          "completed": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "RuntimeDiagnosticsView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sessionId",
          "state",
          "capturedAt",
          "waiting",
          "lastReceivedAt",
          "lastModelSuccessAt",
          "lastSpeechSuccessAt",
          "lastPlaybackSuccessAt",
          "lastFailure",
          "recent",
          "taskEvictions",
          "historyEvictions",
          "audioAssets",
          "dedupEntries",
          "modelWorker",
          "speechWorker"
        ],
        "properties": {
          "sessionId": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "STOPPED",
              "STARTING",
              "RUNNING",
              "STOPPING",
              "FAILED"
            ]
          },
          "capturedAt": {
            "type": "string",
            "format": "date-time"
          },
          "waiting": {
            "type": "array",
            "maxItems": 10,
            "items": {
              "type": "string"
            }
          },
          "lastReceivedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "lastModelSuccessAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "lastSpeechSuccessAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "lastPlaybackSuccessAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "lastFailure": {
            "type": "object",
            "nullable": true,
            "allOf": [
              {
                "$ref": "#/components/schemas/DiagnosticTrace"
              }
            ]
          },
          "recent": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/components/schemas/DiagnosticTrace"
            }
          },
          "taskEvictions": {
            "type": "integer",
            "minimum": 0
          },
          "historyEvictions": {
            "type": "integer",
            "minimum": 0
          },
          "audioAssets": {
            "type": "integer",
            "minimum": 0
          },
          "dedupEntries": {
            "type": "integer",
            "minimum": 0
          },
          "modelWorker": {
            "$ref": "#/components/schemas/DiagnosticWorker"
          },
          "speechWorker": {
            "$ref": "#/components/schemas/DiagnosticWorker"
          }
        },
        "description": "当前会话内存诊断，固定返回最近最多 20 条阶段记录（时间正序），保留 5 分钟；新会话重置。历史失败不代表当前仍失败。与 runtime 分别读取时应按 sessionId/state 校验，不能混用旧会话结果。"
      }
    }
  }
}
