  "components": {
    "schemas": {
      "RuntimeSettings": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "profileName",
          "persona",
          "roomId",
          "model",
          "maxOutputTokens",
          "voice",
          "readComment",
          "welcomeIntervalSeconds",
          "synthesisQueueCapacity",
          "playbackQueueCapacity",
          "priorities"
        ],
        "properties": {
          "profileName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "persona": {
            "type": "string",
            "maxLength": 8000
          },
          "roomId": {
            "type": "string",
            "pattern": "^[0-9]{0,30}$"
          },
          "model": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "maxOutputTokens": {
            "type": "integer",
            "minimum": 32,
            "maximum": 2048
          },
          "voice": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "readComment": {
            "type": "boolean"
          },
          "welcomeIntervalSeconds": {
            "type": "integer",
            "minimum": 5,
            "maximum": 600
          },
          "synthesisQueueCapacity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "playbackQueueCapacity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "priorities": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "gift",
              "comment",
              "follow",
              "entrance"
            ],
            "properties": {
              "gift": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "comment": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "follow": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "entrance": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              }
            }
          }
        }
      },
      "ConfigSnapshot": {
        "type": "object",
        "required": [
          "version",
          "updatedAt",
          "settings"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "settings": {
            "$ref": "#/components/schemas/RuntimeSettings"
          }
        }
      },
      "UpdateConfigRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedVersion",
          "settings"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "settings": {
            "$ref": "#/components/schemas/RuntimeSettings"
          }
        }
      },
      "ApiError": {
        "type": "object",
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "Bootstrap": {
        "type": "object",
        "required": [
          "application",
          "version",
          "mode",
          "sessionState",
          "capabilities"
        ],
        "properties": {
          "application": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "SCAFFOLD",
              "READY"
            ]
