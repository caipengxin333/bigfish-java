                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "413": {
            "description": "JSON 请求超过 32768 字节",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "429": {
            "description": "检查间隔30秒且每5分钟最多3次",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          },
          "503": {
            "description": "凭据不可用或检查无法创建",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DouyinAccessError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DouyinSetGuest"
              }
            }
          }
        }
      }
    },
