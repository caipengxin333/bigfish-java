<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>故障摘要布局验收</title>

<h1>故障摘要 · 仅本地夹具</h1><p>实际 Vue 页面；所有 HTTP、WebSocket、音频为替身，未接入真实服务。</p>

<h2>舞台合成失败 · 375px</h2><iframe title="375px 舞台" width="375" height="1050" src="/tests/status-fixture.html?scenario=speech"></iframe>

const check = () => { document.getElementById('result').textContent = [...document.querySelectorAll('iframe')].map(frame => { const doc = frame.contentDocument.documentElement; return `${frame.title}: ${doc.clientWidth}/${doc.scrollWidth} ${doc.scrollWidth <= doc.clientWidth ? 'PASS' : 'FAIL'}` }).join('；') }
document.getElementById('check').onclick = check
window.addEventListener('load', check)
